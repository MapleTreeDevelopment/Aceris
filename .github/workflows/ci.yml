name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run checks
        run: ./gradlew check
      - name: Run benchmark smoke
        run: ./gradlew benchmark -Daceris.benchmark.warmup=5 -Daceris.benchmark.iterations=10
