name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release artifacts
        run: ./gradlew clean check jar sourcesJar javadocJar -Pversion=${GITHUB_REF_NAME#v}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Aceris ${GITHUB_REF_NAME#v}" \
            --notes "Release ${GITHUB_REF_NAME#v} of Aceris." \
            build/libs/*.jar
